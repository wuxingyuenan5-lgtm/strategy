name: MA Breakdown v0.2

on:
  push:
    branches:
      - agent/ma-breakdown-v0.2
    paths:
      - "ma_breakdown/config/**"
      - "ma_breakdown/src/**"
      - "ma_breakdown/tests/**"
      - "ma_breakdown/templates/**"
      - "ma_breakdown/run_pipeline.py"
      - "ma_breakdown/requirements.txt"
      - ".github/workflows/ma-breakdown-v02.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ma_breakdown/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ma_breakdown/requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest ma_breakdown/tests -q

      - name: Probe Sina and Tencent index history via AKShare
        run: |
          pip install -q akshare
          python - <<'PY'
          import akshare as ak
          symbols={
            '上证指数':'sh000001','上证50':'sh000016','沪深300':'sh000300','中证1000':'sh000852',
            '创业板指':'sz399006','科创50':'sh000688','中证红利':'sh000922'
          }
          for name,symbol in symbols.items():
              print('===',name,symbol)
              try:
                  df=ak.stock_zh_index_daily(symbol=symbol)
                  print('SINA rows=',len(df),'first=',df['date'].iloc[0] if len(df) else None,'last=',df['date'].iloc[-1] if len(df) else None)
              except Exception as e:
                  print('SINA ERROR',type(e).__name__,str(e)[:240])
              try:
                  df=ak.stock_zh_index_daily_tx(symbol=symbol,start_date='20040101',end_date='20260731')
                  print('TX rows=',len(df),'first=',df['date'].iloc[0] if len(df) else None,'last=',df['date'].iloc[-1] if len(df) else None)
              except Exception as e:
                  print('TX ERROR',type(e).__name__,str(e)[:240])
          PY

      - name: Run full historical analysis
        run: PYTHONPATH=. python ma_breakdown/run_pipeline.py --cutoff 2026-07-31 --output ma_breakdown/output/v0.2

      - name: Verify production bundle
        run: |
          test -s ma_breakdown/output/v0.2/index.html
          test -s ma_breakdown/output/v0.2/events.csv
          test -s ma_breakdown/output/v0.2/summary.json
          test -s ma_breakdown/output/v0.2/data_quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('ma_breakdown/output/v0.2/data_quality.json').read_text())
          s=json.loads(Path('ma_breakdown/output/v0.2/summary.json').read_text())
          assert q['status'] != 'FAIL', q
          assert s['meta']['event_count'] > 0, s['meta']
          assert len(s['instrument_names']) == 7
          assert '中证全指' not in s['instrument_names']
          html=Path('ma_breakdown/output/v0.2/index.html').read_text()
          assert '{{' not in html and 'TODO' not in html
          print('quality=',q['status'],'events=',s['meta']['event_count'])
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ma-breakdown-v0.2-report
          path: ma_breakdown/output/v0.2
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated analysis bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ma_breakdown/output/v0.2
          if ! git diff --cached --quiet; then
            git commit -m "Generate v0.2 report [skip ci]"
            git push
          fi
