name: MA Breakdown v0.2

on:
  push:
    branches:
      - agent/ma-breakdown-v0.2
    paths:
      - "ma_breakdown/config/**"
      - "ma_breakdown/src/**"
      - "ma_breakdown/tests/**"
      - "ma_breakdown/templates/**"
      - "ma_breakdown/run_pipeline.py"
      - "ma_breakdown/requirements.txt"
      - ".github/workflows/ma-breakdown-v02.yml"
  workflow_dispatch:

concurrency:
  group: ma-breakdown-v02-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ma_breakdown/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ma_breakdown/requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest ma_breakdown/tests -q

      - name: Probe Tencent yearly index history
        run: |
          python - <<'PY'
          import json, requests
          symbols={
            '上证指数':'sh000001','上证50':'sh000016','沪深300':'sh000300','中证1000':'sh000852',
            '创业板指':'sz399006','科创50':'sh000688','中证红利':'sh000922'
          }
          url='https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get'
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://gu.qq.com/'}
          for name,symbol in symbols.items():
              print('===',name,symbol)
              for year in (2005,2015,2025):
                  params={'_var':'kline_dayqfq','param':f'{symbol},day,{year}-01-01,{year+1}-12-31,640,qfq','r':'0.8205512681390605'}
                  try:
                      r=requests.get(url,params=params,headers=headers,timeout=15)
                      print(year,'status',r.status_code,'bytes',len(r.content),end=' ')
                      r.raise_for_status()
                      text=r.text
                      raw=text[text.find('=')+1:].strip()
                      obj=json.loads(raw)
                      node=(obj.get('data') or {}).get(symbol) or {}
                      rows=node.get('day') or node.get('qfqday') or []
                      print('rows=',len(rows),'first=',rows[0][0] if rows else None,'last=',rows[-1][0] if rows else None,'keys=',list(node)[:5])
                  except Exception as e:
                      print('ERROR',type(e).__name__,str(e)[:180])
          PY

      - name: Diagnostic stop before production
        run: echo "Tencent probe complete; production source not switched yet."
